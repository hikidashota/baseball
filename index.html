<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      padding-bottom: 100px;
      background-color: #f5f5f5;
      color: #333;
    }

    header {
      background-color: #44000;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    section {
      background-color: white;
      margin-bottom: 20px;
      padding: 25px;
      border-radius: 8px;
    }

    h2 {
      color: #333;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }

    footer a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>野球観戦</h1>
  </header>

  <main>
    <section>
      <h2>マツダスタジアム</h2>
      <p>
        今まで行った球場の中で1番よく
      </p>
    </section>

    <section>

      </p>
    </section>
  </main>

    <p>
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </p>
  </footer>

</body>
</html>
